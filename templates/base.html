{% load static %}
<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Palette{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body><header><a class="logo" href="{% url 'photo_list' %}">Palette</a><nav>{% if user.is_authenticated %}<span>{{ user.username }}</span><a href="{% url 'upload' %}">投稿する</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>ログアウト</button></form>{% else %}<a href="{% url 'login' %}">ログイン</a><a href="{% url 'signup' %}">登録</a>{% endif %}</nav></header>{% if messages %}<section class="messages">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</section>{% endif %}{% block content %}{% endblock %}</body></html>
